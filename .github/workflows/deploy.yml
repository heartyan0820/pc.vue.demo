# 构建 Vue 项目并部署到 GitHub Pages
# 触发条件：推送到 main 分支，或手动在 Actions 页面点击运行
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 在 GitHub 仓库的 Actions 标签页里会出现"Run workflow"按钮

# 同一分支新推送会取消之前还在跑的旧构建，避免重复部署
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write      # 部署到 Pages 需要写入权限
  id-token: write   # 使用官方 deploy action 需要这个

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js（用 .nvmrc / package.json engines 之外的固定版本，最简单）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # 自动缓存 npm 依赖，第二次构建会更快

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm ci # ci 比 install 更严格、更快，要求 package-lock.json 存在

      # 4. 构建生产包，输出到 dist/
      - name: Build
        run: npm run build

      # 5. 把构建产物上传为一个 artifact（中间产物）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 6. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
